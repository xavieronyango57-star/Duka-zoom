<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duka Zoom — Riders App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F1; --ink:#16231C; --ink-soft:#4E5B52;
    --teal:#0F766E; --teal-dark:#0B5C56; --amber:#F2A93B; --coral:#E2543F;
    --card:#FFFFFF; --line:#DCE3D8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- PIN SCREEN ---------- */
  #pin-screen, #name-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .pin-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:32px 28px; width:100%; max-width:340px; text-align:center;
  }
  .pin-card .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; margin-bottom:6px;}
  .pin-card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:22px;}
  .pin-card input{
    width:100%; padding:14px; border:1px solid var(--line); border-radius:10px;
    font-size:22px; text-align:center; letter-spacing:6px; margin-bottom:14px;
  }
  .pin-card input:focus-visible{outline:3px solid var(--amber);}
  .pin-card button{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:24px;
    padding:13px; font-weight:700; font-size:15px;
  }
  .pin-card button:hover{background:var(--teal-dark);}
  .pin-error{color:var(--coral); font-size:13px; margin-top:10px; min-height:16px;}

  /* ---------- REASON MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,35,28,.5); z-index:300;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:380px;
  }
  .modal-card h3{font-family:'Space Grotesk', sans-serif; font-size:18px; margin-bottom:6px;}
  .modal-sub{font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .modal-card textarea{
    width:100%; min-height:90px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; resize:vertical;
  }
  .modal-card textarea:focus-visible{outline:3px solid var(--amber);}
  .modal-actions-row{display:flex; gap:10px; margin-top:16px;}
  .modal-btn-cancel{flex:1; background:none; border:1px solid var(--line); border-radius:20px; padding:11px; font-weight:600; font-size:13.5px; color:var(--ink-soft);}
  .modal-btn-submit{flex:1; background:var(--coral); color:#fff; border:none; border-radius:20px; padding:11px; font-weight:700; font-size:13.5px;}
  .modal-btn-submit:hover{background:#c8432f;}

  /* ---------- DASHBOARD ---------- */
  #dashboard{min-height:100vh; display:none;}
  #dashboard.show{display:block;}
  header{
    background:var(--teal); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  header .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px;}
  .header-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:13px; font-weight:600;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.28);}
  .icon-btn.view-tab.active{background:#fff; color:var(--teal-dark);}
  .period-tabs{display:flex; gap:6px;}
  .period-tab{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .period-tab.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .payout-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;
  }
  .payout-card .rider-name{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; margin-bottom:10px;}
  .payout-card .payout-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .payout-card .payout-row:last-child{border-bottom:none;}
  .payout-card .payout-row.highlight{font-weight:700; font-size:15px; color:var(--teal-dark); padding-top:8px;}
  .customer-pays-box{
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .customer-pays-box .label{font-size:12px; color:var(--ink-soft);}
  .customer-pays-box .value{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px;}
  .earning-box{
    background:#FCE8CE; border:1px solid #E8B96A; border-radius:8px; padding:10px 12px; margin:8px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .earning-box .label{font-size:12px; color:#8a5a12;}
  .earning-box .value{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; color:#8a5a12;}
  .week-nav{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .week-label{font-size:13px; font-weight:600; min-width:170px; text-align:center;}
  .period-tab:disabled{opacity:.4; cursor:default;}
  .summary-card{
    background:var(--teal); color:#fff; border-radius:12px; padding:16px 18px;
  }
  .summary-card .label{font-size:12.5px; opacity:.85;}
  .summary-card .value{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; margin-top:2px;}
  .summary-card .sub{font-size:12.5px; opacity:.85; margin-top:2px;}
  .payout-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px;}
  .payout-head .rider-name{margin-bottom:0;}
  .payout-total{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; color:var(--teal-dark); white-space:nowrap;}
  .day-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .day-table th{
    text-align:left; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.4px; padding:6px 4px; border-bottom:1px solid var(--line);
  }
  .day-table td{padding:7px 4px; border-bottom:1px dashed var(--line);}
  .day-table .num{text-align:right;}
  .day-table tr.today td{background:#EAF2E9; font-weight:600;}
  .day-table tr.empty-day td{color:#9aa39c;}
  .day-table tfoot td{border-top:2px solid var(--line); border-bottom:none; font-weight:700; padding-top:9px;}
  .payout-meta{font-size:12.5px; color:var(--ink-soft); margin-top:8px;}
  .warn-note{
    background:#FCE8CE; color:#8a5a12; border-radius:8px; padding:8px 12px; font-size:12.5px; margin-top:10px;
  }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:16px 20px 0;
  }
  .toolbar .count{font-family:'Space Grotesk', sans-serif; font-size:16px;}
  .toggle-all{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);}

  .orders-list{padding:16px 20px 40px; display:flex; flex-direction:column; gap:14px; max-width:720px; margin:0 auto;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;}

  .order-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;
  }
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .order-id{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px;}
  .order-time{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .status-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px; white-space:nowrap;
  }
  .status-pill.placed{background:#E7E2D0; color:#6b5f3d;}
  .status-pill.preparing{background:#FCE8CE; color:#8a5a12;}
  .status-pill.out{background:#D6E9F5; color:#1a5a82;}
  .status-pill.delivered{background:#DCEEE0; color:#1f6b3a;}
  .status-pill.failed{background:#FBDFD9; color:#a13a26;}
  .failed-note{
    background:#FBDFD9; color:#a13a26; border-radius:8px; padding:8px 12px;
    font-size:12.5px; margin-top:8px;
  }

  .order-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed var(--line);}
  .order-row:last-of-type{border-bottom:none;}
  .order-row .label{color:var(--ink-soft);}
  .order-items{font-size:12.5px; color:var(--ink); white-space:pre-line; margin-top:2px;}

  .pay-flags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .flag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px;}
  .flag.paid{background:#DCEEE0; color:#1f6b3a;}
  .flag.notpaid{background:#FBDFD9; color:#a13a26;}
  .flag.mpesa{background:#D6E9F5; color:#1a5a82;}
  .flag.cod{background:#FCE8CE; color:#8a5a12;}

  .order-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .action-btn{
    flex:1; min-width:110px; border:none; border-radius:20px; padding:10px 12px;
    font-size:12.5px; font-weight:700; color:#fff;
  }
  .action-btn.preparing{background:var(--amber); color:var(--ink);}
  .action-btn.out{background:#3E7FA6;}
  .action-btn.delivered{background:var(--teal);}
  .action-btn.failed{background:var(--coral);}
  .action-btn:hover{opacity:0.88;}
  .action-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .contact-row{display:flex; gap:8px; margin-top:8px;}
  .contact-btn{
    flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:20px;
    padding:9px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .contact-btn:hover{background:var(--bg);}

  @media (max-width:480px){
    header{padding:14px 16px;}
    .orders-list{padding:14px 16px 40px;}
  }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pin-screen">
  <div class="pin-card">
    <div class="logo">🛍 Duka Zoom</div>
    <div class="sub">Riders App — enter your access PIN</div>
    <input type="password" id="pin-input" inputmode="numeric" placeholder="••••" maxlength="6">
    <button id="pin-submit">Enter</button>
    <p class="pin-error" id="pin-error"></p>
  </div>
</div>

<!-- RIDER NAME -->
<div id="name-screen" class="hidden">
  <div class="pin-card">
    <div class="logo">🛍 Duka Zoom</div>
    <div class="sub">What's your name? This is how earnings get tracked to you.</div>
    <input type="text" id="rider-name-input" placeholder="e.g. John Mwangi">
    <button id="name-submit">Continue</button>
    <p class="pin-error" id="name-error"></p>
  </div>
</div>

<!-- NOT DELIVERED REASON MODAL -->
<div id="reason-overlay" class="modal-overlay">
  <div class="modal-card">
    <h3>Why wasn't this delivered?</h3>
    <p class="modal-sub">This note will be saved on the order so the shop owner can follow up.</p>
    <textarea id="reason-input" placeholder="e.g. Customer didn't answer the phone"></textarea>
    <p class="pin-error" id="reason-error"></p>
    <div class="modal-actions-row">
      <button id="reason-cancel" class="modal-btn-cancel">Cancel</button>
      <button id="reason-submit" class="modal-btn-submit">Submit</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div>
      <div class="logo">🛍 Duka Zoom — Riders</div>
      <div id="rider-label" style="font-size:12px; opacity:0.85; margin-top:2px;"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn view-tab active" data-view="orders">📦 Orders</button>
      <button class="icon-btn view-tab" data-view="payouts">💰 Payouts</button>
      <button class="icon-btn" id="refresh-btn">🔄</button>
      <button class="icon-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <!-- ORDERS VIEW -->
  <div id="orders-view">
    <div class="toolbar">
      <div class="count" id="order-count">Loading orders…</div>
      <label class="toggle-all">
        <input type="checkbox" id="show-all-toggle">
        Show delivered too
      </label>
    </div>
    <div class="orders-list" id="orders-list">
      <p class="empty-state">Loading…</p>
    </div>
  </div>

  <!-- PAYOUTS VIEW -->
  <div id="payouts-view" class="hidden">
    <div class="toolbar">
      <div class="count">Rider payments</div>
      <div class="week-nav">
        <button class="period-tab" id="week-prev" aria-label="Previous week">◀</button>
        <span class="week-label" id="week-label"></span>
        <button class="period-tab" id="week-next" aria-label="Next week">▶</button>
        <button class="period-tab" id="week-today">This week</button>
      </div>
    </div>
    <div class="orders-list" id="payouts-list">
      <p class="empty-state">Loading…</p>
    </div>
  </div>
</div>

<script>
  // =========================================================
  // CONFIG — same webhook URL as the main site, plus a shared
  // access PIN for riders. Change the PIN any time by editing
  // this one line (no Apps Script changes needed for that).
  // =========================================================
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw-OaVKDCtDG2TpuR873_XCwWtR86qjDQV9lfmwxMRjatBCPj_jgj-HMQi93vCoTxf9/exec';
  const RIDER_PIN = '1234'; // give this PIN to your riders
  const OWNER_PIN = '9999'; // keep this one for yourself — unlocks full payouts with commission breakdown, for every rider
  const RIDER_COMMISSION_PERCENT = 25; // your cut of each delivery fee — riders keep the rest

  const STATUS_FLOW = ['Placed', 'Preparing', 'Out for Delivery', 'Delivered'];
  const AUTO_REFRESH_MS = 30000;

  const fmt = (n) => 'KSh ' + Number(n || 0).toLocaleString();

  // ---- JSONP helper (same pattern as the main site) ----
  function jsonpRequest(url, params){
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const query = new URLSearchParams({ ...params, callback: callbackName }).toString();
      const cleanup = () => { delete window[callbackName]; script.remove(); };
      const timeout = setTimeout(() => { cleanup(); reject(new Error('Request timed out.')); }, 10000);
      window[callbackName] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
      script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error('Could not reach the server.')); };
      script.src = `${url}?${query}`;
      document.body.appendChild(script);
    });
  }

  // ---- PIN GATE ----
  const pinScreen = document.getElementById('pin-screen');
  const nameScreen = document.getElementById('name-screen');
  const dashboard = document.getElementById('dashboard');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');
  const riderNameInput = document.getElementById('rider-name-input');
  const nameError = document.getElementById('name-error');

  let currentRiderName = '';
  let isOwnerMode = false;
  let refreshTimer = null;

  document.getElementById('pin-submit').addEventListener('click', tryPin);
  pinInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') tryPin(); });
  document.getElementById('name-submit').addEventListener('click', trySubmitName);
  riderNameInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') trySubmitName(); });

  function tryPin(){
    const entered = pinInput.value.trim();
    if (entered === RIDER_PIN || entered === OWNER_PIN){
      isOwnerMode = (entered === OWNER_PIN);
      pinScreen.classList.add('hidden');
      nameScreen.classList.remove('hidden');
      riderNameInput.placeholder = isOwnerMode ? 'e.g. Owner (just for the header label)' : 'e.g. John Mwangi';
      riderNameInput.focus();
    } else {
      pinError.textContent = 'Incorrect PIN — try again.';
      pinInput.value = '';
    }
  }

  function trySubmitName(){
    const name = riderNameInput.value.trim();
    if (!name){
      nameError.textContent = 'Please enter your name.';
      return;
    }
    currentRiderName = name;
    nameScreen.classList.add('hidden');
    dashboard.classList.add('show');
    document.getElementById('rider-label').textContent = `👤 ${currentRiderName}`;
    loadOrders();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadOrders, AUTO_REFRESH_MS);
  }

  document.getElementById('logout-btn').addEventListener('click', ()=>{
    dashboard.classList.remove('show');
    pinScreen.classList.remove('hidden');
    pinInput.value = '';
    pinError.textContent = '';
    riderNameInput.value = '';
    nameError.textContent = '';
    currentRiderName = '';
    isOwnerMode = false;
    if (refreshTimer) clearInterval(refreshTimer);
  });

  // ---- ORDERS ----
  const ordersList = document.getElementById('orders-list');
  const orderCount = document.getElementById('order-count');
  const showAllToggle = document.getElementById('show-all-toggle');

  document.getElementById('refresh-btn').addEventListener('click', ()=>{
    if (currentView === 'orders') loadOrders(); else loadPayouts();
  });

  // ---- VIEW SWITCHING ----
  let currentView = 'orders';
  const ordersView = document.getElementById('orders-view');
  const payoutsView = document.getElementById('payouts-view');
  const viewTabs = document.querySelectorAll('.view-tab');

  viewTabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      currentView = tab.dataset.view;
      viewTabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      ordersView.classList.toggle('hidden', currentView !== 'orders');
      payoutsView.classList.toggle('hidden', currentView !== 'payouts');
      if (currentView === 'orders') loadOrders(); else loadPayouts();
    });
  });
  showAllToggle.addEventListener('change', loadOrders);

  function statusClass(status){
    if (status === 'Preparing') return 'preparing';
    if (status === 'Out for Delivery') return 'out';
    if (status === 'Delivered') return 'delivered';
    if (status === 'Not Delivered') return 'failed';
    return 'placed';
  }

  function nextStatus(current){
    const idx = STATUS_FLOW.indexOf(current);
    return idx >= 0 && idx < STATUS_FLOW.length - 1 ? STATUS_FLOW[idx + 1] : null;
  }

  function loadOrders(){
    if (SHEET_WEBHOOK_URL.includes('PASTE_YOUR')){
      ordersList.innerHTML = '<p class="empty-state">Not connected yet — paste your Apps Script Web App URL into SHEET_WEBHOOK_URL in this file.</p>';
      orderCount.textContent = 'Not connected';
      return;
    }
    jsonpRequest(SHEET_WEBHOOK_URL, { action: 'getOrders', includeAll: showAllToggle.checked ? '1' : '0' })
      .then(data => {
        if (data.status === 'ok'){
          renderOrders(data.orders);
        } else {
          ordersList.innerHTML = `<p class="empty-state">${data.message || 'Could not load orders.'}</p>`;
        }
      })
      .catch(()=>{
        ordersList.innerHTML = '<p class="empty-state">Could not reach the server — check your connection and try Refresh.</p>';
      });
  }

  function renderOrders(orders){
    // Once a rider accepts an order it belongs to them — other riders shouldn't see it.
    // The owner (owner PIN) still sees every order.
    if (!isOwnerMode){
      const me = currentRiderName.trim().toLowerCase();
      orders = orders.filter(o => !o.rider || String(o.rider).trim().toLowerCase() === me);
    }
    orderCount.textContent = orders.length + (orders.length === 1 ? ' order' : ' orders');
    if (orders.length === 0){
      ordersList.innerHTML = '<p class="empty-state">No active orders right now. 🎉</p>';
      return;
    }

    ordersList.innerHTML = orders.map(o => {
      const next = nextStatus(o.orderStatus);
      const itemLines = String(o.items || '').split('\n');
      const qtyLines = String(o.quantities || '').split('\n');
      const itemsDisplay = itemLines.map((name, i) => `${qtyLines[i] || '1'}x ${name}`).join('\n');
      const paidFlag = o.paymentStatus === 'Paid'
        ? `<span class="flag paid">Paid</span>`
        : `<span class="flag notpaid">Not Paid</span>`;
      const methodFlag = String(o.paymentMethod || '').toLowerCase().includes('cash')
        ? `<span class="flag cod">Cash on Delivery</span>`
        : `<span class="flag mpesa">M-Pesa</span>`;
      const whatsappHref = `https://wa.me/${String(o.phone).replace(/[^0-9]/g,'')}`;

      // What the rider actually needs to collect from the customer in person —
      // zero if already paid via M-Pesa Till, full total if cash on delivery.
      const isCod = o.paymentStatus !== 'Paid';
      const collectAmount = isCod ? Number(o.total) : 0;
      const riderEarning = Math.round(Number(o.deliveryFee || 0) * (1 - RIDER_COMMISSION_PERCENT / 100));

      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">${o.orderId || '(no ID)'}</div>
              <div class="order-time">${new Date(o.timestamp).toLocaleString()}</div>
            </div>
            <span class="status-pill ${statusClass(o.orderStatus)}">${o.orderStatus}</span>
          </div>

          <div class="order-row"><span class="label">Customer</span><span>${o.name}</span></div>
          <div class="order-row"><span class="label">Phone</span><span>${o.phone}</span></div>
          <div class="order-row"><span class="label">Address</span><span>${o.address}</span></div>
          <div class="order-row"><span class="label">Items</span></div>
          <div class="order-items">${itemsDisplay}</div>

          <div class="customer-pays-box">
            <span class="label">${isCod ? 'Collect from customer (cash)' : 'Already paid via M-Pesa — collect'}</span>
            <span class="value">${fmt(collectAmount)}</span>
          </div>

          <div class="earning-box">
            <span class="label">You'll earn for this delivery</span>
            <span class="value">${fmt(riderEarning)}</span>
          </div>

          <div class="pay-flags">${methodFlag}${paidFlag}</div>

          <div class="contact-row">
            <a class="contact-btn" href="tel:${o.phone}">📞 Call</a>
            <a class="contact-btn" href="${whatsappHref}" target="_blank" rel="noopener">💬 WhatsApp</a>
          </div>

          ${o.rider ? `<div class="order-row"><span class="label">Rider</span><span>${o.rider}</span></div>` : ''}
          ${o.orderStatus === 'Not Delivered' && o.deliveryNotes
            ? `<div class="failed-note">Reason: ${o.deliveryNotes}</div>` : ''}

          <div class="order-actions">${actionButtons(o)}</div>
        </div>`;
    }).join('');

    ordersList.querySelectorAll('[data-order-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if (btn.dataset.newStatus === 'Not Delivered'){
          openReasonModal(btn.dataset.orderId);
        } else {
          updateStatus(btn.dataset.orderId, btn.dataset.newStatus, btn);
        }
      });
    });
  }

  // Which buttons a card shows depends on where the order is in its journey.
  // Accepting is the moment a rider's name gets attached to the order.
  function actionButtons(o){
    const id = o.orderId;
    const btn = (status, cls, label) =>
      `<button class="action-btn ${cls}" data-order-id="${id}" data-new-status="${status}">${label}</button>`;

    if (o.orderStatus === 'Placed'){
      return btn('Preparing', 'preparing', 'Mark as Preparing') + btn('Out for Delivery', 'out', '✅ Accept Order');
    }
    if (o.orderStatus === 'Preparing'){
      return btn('Out for Delivery', 'out', '✅ Accept Order');
    }
    if (o.orderStatus === 'Out for Delivery'){
      return btn('Delivered', 'delivered', '✅ Delivered') + btn('Not Delivered', 'failed', '❌ Not Delivered');
    }
    if (o.orderStatus === 'Delivered'){
      return `<button class="action-btn delivered" disabled>Delivered ✓</button>`;
    }
    return `<button class="action-btn failed" disabled>Not delivered ✗</button>`;
  }

  // ---- NOT DELIVERED: ask for a reason before saving ----
  const reasonOverlay = document.getElementById('reason-overlay');
  const reasonInput = document.getElementById('reason-input');
  const reasonError = document.getElementById('reason-error');
  let reasonOrderId = null;

  function openReasonModal(orderId){
    reasonOrderId = orderId;
    reasonInput.value = '';
    reasonError.textContent = '';
    reasonOverlay.classList.add('open');
    reasonInput.focus();
  }
  document.getElementById('reason-cancel').addEventListener('click', ()=> reasonOverlay.classList.remove('open'));
  document.getElementById('reason-submit').addEventListener('click', ()=>{
    const reason = reasonInput.value.trim();
    if (!reason){
      reasonError.textContent = 'Please give a reason.';
      return;
    }
    reasonOverlay.classList.remove('open');
    updateStatus(reasonOrderId, 'Not Delivered', null, reason);
  });

  function updateStatus(orderId, newStatus, btn, reason){
    if (btn){
      btn.disabled = true;
      btn.textContent = 'Updating…';
    }
    const params = { action: 'updateOrderStatus', orderId, newStatus, riderName: currentRiderName };
    if (reason) params.reason = reason;
    jsonpRequest(SHEET_WEBHOOK_URL, params)
      .then(data => {
        if (data.status === 'ok'){
          loadOrders(); // refresh the whole list so the card reflects the new status
        } else {
          alert(data.message || 'Could not update status.');
          loadOrders(); // e.g. another rider already accepted it — show the current state
        }
      })
      .catch((err)=>{
        alert('Could not update the order: ' + ((err && err.message) || err) + '\n\n(Take a screenshot of this and send it back.)');
        if (btn) btn.disabled = false;
        loadOrders();
      });
  }

  // =========================================================
  // RIDER PAYMENTS — one card per rider, showing what they are owed for
  // each day of the chosen week and the week's total. Built from delivered
  // orders that have a rider attached (set when the rider taps Accept).
  // Days and weeks follow this device's own time zone; weeks run Mon–Sun.
  // The owner PIN shows every rider plus your commission; a rider sees only
  // their own card, with no commission.
  // =========================================================
  const payoutsList = document.getElementById('payouts-list');
  let DELIVERIES = [];
  let weekOffset = 0; // 0 = this week, -1 = last week, and so on

  const escHtml = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const dayKey = (d) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();

  function mondayOf(d){
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function weekStartFor(offset){
    const start = mondayOf(new Date());
    start.setDate(start.getDate() + offset * 7);
    return start;
  }

  // What a rider keeps from one delivery — same rounding as the amount on each order card,
  // so the daily and weekly figures always add up to what riders saw per delivery.
  function riderShare(fee){
    return fee === null || fee === undefined ? 0 : Math.round(fee * (1 - RIDER_COMMISSION_PERCENT / 100));
  }

  function groupRiders(){
    const map = new Map();
    DELIVERIES.forEach((d) => {
      const key = String(d.rider || '').trim().toLowerCase(); // "Edward" and "edward " are the same rider
      if (!key) return;
      let r = map.get(key);
      if (!r){ r = { key, name: String(d.rider).trim(), items: [] }; map.set(key, r); }
      r.items.push(d);
    });
    return [...map.values()];
  }

  function summarizeWeek(rider, weekStart){
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);
    const days = [];
    const byKey = new Map();
    for (let i = 0; i < 7; i++){
      const date = new Date(weekStart);
      date.setDate(date.getDate() + i);
      const day = { date, count: 0, amount: 0 };
      days.push(day);
      byKey.set(dayKey(date), day);
    }
    let count = 0, amount = 0, fees = 0, noFee = 0;
    rider.items.forEach((d) => {
      if (d.date < weekStart || d.date >= weekEnd) return;
      const share = riderShare(d.fee);
      const day = byKey.get(dayKey(d.date));
      if (day){ day.count += 1; day.amount += share; }
      count += 1; amount += share;
      if (d.fee === null || d.fee === undefined) noFee += 1; else fees += d.fee;
    });
    const now = new Date();
    const month = rider.items
      .filter((d) => d.date.getFullYear() === now.getFullYear() && d.date.getMonth() === now.getMonth())
      .reduce((a, d) => a + riderShare(d.fee), 0);
    return { days, count, amount, fees, commission: fees - amount, noFee, month };
  }

  function dayLabel(date){
    return date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
  }

  function renderPayouts(){
    const start = weekStartFor(weekOffset);
    const last = new Date(start);
    last.setDate(last.getDate() + 6);
    document.getElementById('week-label').textContent =
      dayLabel(start) + ' – ' + dayLabel(last) + (weekOffset === 0 ? ' (this week)' : '');
    document.getElementById('week-next').disabled = weekOffset >= 0;

    let riders = groupRiders();
    if (!isOwnerMode){
      const me = currentRiderName.trim().toLowerCase();
      riders = riders.filter((r) => r.key === me);
    }
    const monthName = new Date().toLocaleDateString('en-GB', { month: 'long' });
    const todayKey = dayKey(new Date());

    const cards = riders
      .map((r) => ({ r, s: summarizeWeek(r, start) }))
      .filter((x) => x.s.count > 0)
      .sort((a, b) => b.s.amount - a.s.amount || a.r.name.localeCompare(b.r.name));

    if (cards.length === 0){
      payoutsList.innerHTML = isOwnerMode
        ? '<p class="empty-state">No completed deliveries this week.</p>'
        : '<p class="empty-state">No completed deliveries for you this week.</p>';
      return;
    }

    let html = '';
    if (isOwnerMode){
      const totalOwed = cards.reduce((a, x) => a + x.s.amount, 0);
      const totalDeliveries = cards.reduce((a, x) => a + x.s.count, 0);
      const totalCommission = cards.reduce((a, x) => a + x.s.commission, 0);
      html += `
        <div class="summary-card">
          <div class="label">Total to pay riders for this week</div>
          <div class="value">${fmt(totalOwed)}</div>
          <div class="sub">${totalDeliveries} ${totalDeliveries === 1 ? 'delivery' : 'deliveries'} · ${cards.length} ${cards.length === 1 ? 'rider' : 'riders'} · your ${RIDER_COMMISSION_PERCENT}% commission ${fmt(totalCommission)}</div>
        </div>`;
    }

    html += cards.map(({ r, s: sum }) => `
      <div class="payout-card">
        <div class="payout-head">
          <div class="rider-name">👤 ${escHtml(r.name)}</div>
          <div class="payout-total">${fmt(sum.amount)}</div>
        </div>
        <table class="day-table">
          <thead><tr><th>Day</th><th class="num">Deliveries</th><th class="num">${isOwnerMode ? 'You owe' : 'You earn'}</th></tr></thead>
          <tbody>
            ${sum.days.map((d) => `
              <tr class="${dayKey(d.date) === todayKey ? 'today' : ''} ${d.count ? '' : 'empty-day'}">
                <td>${dayLabel(d.date)}</td>
                <td class="num">${d.count || '—'}</td>
                <td class="num">${d.count ? fmt(d.amount) : '—'}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot><tr><td>Week total</td><td class="num">${sum.count}</td><td class="num">${fmt(sum.amount)}</td></tr></tfoot>
        </table>
        ${isOwnerMode ? `<div class="payout-meta">Delivery fees ${fmt(sum.fees)} · your ${RIDER_COMMISSION_PERCENT}% commission ${fmt(sum.commission)}</div>` : ''}
        <div class="payout-meta">${monthName} so far: ${fmt(sum.month)}</div>
        ${sum.noFee ? `<div class="warn-note">⚠ ${sum.noFee} ${sum.noFee === 1 ? 'delivery has' : 'deliveries have'} no delivery fee recorded, so ${sum.noFee === 1 ? 'it adds' : 'they add'} KSh 0 here. Fix the Delivery Fee in the Orders sheet to include ${sum.noFee === 1 ? 'it' : 'them'}.</div>` : ''}
      </div>`).join('');

    payoutsList.innerHTML = html;
  }

  document.getElementById('week-prev').addEventListener('click', () => { weekOffset -= 1; renderPayouts(); });
  document.getElementById('week-next').addEventListener('click', () => { if (weekOffset < 0){ weekOffset += 1; renderPayouts(); } });
  document.getElementById('week-today').addEventListener('click', () => { weekOffset = 0; renderPayouts(); });

  function loadPayouts(){
    if (SHEET_WEBHOOK_URL.includes('PASTE_YOUR')){
      payoutsList.innerHTML = '<p class="empty-state">Not connected yet.</p>';
      return;
    }
    payoutsList.innerHTML = '<p class="empty-state">Loading…</p>';
    jsonpRequest(SHEET_WEBHOOK_URL, { action: 'getDeliveries' })
      .then((data) => {
        if (data.status !== 'ok' || !Array.isArray(data.deliveries)){
          payoutsList.innerHTML = '<p class="empty-state">' + escHtml(data.message || 'Could not load payments.') + '</p>';
          return;
        }
        DELIVERIES = data.deliveries.map((d) => ({ ...d, date: new Date(d.t) }));
        renderPayouts();
      })
      .catch(() => {
        payoutsList.innerHTML = '<p class="empty-state">Could not reach the server — try again.</p>';
      });
  }
</script>

</body>
</html>

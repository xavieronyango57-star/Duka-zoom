<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duka Zoom — Riders App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F1; --ink:#16231C; --ink-soft:#4E5B52;
    --teal:#0F766E; --teal-dark:#0B5C56; --amber:#F2A93B; --coral:#E2543F;
    --card:#FFFFFF; --line:#DCE3D8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- PIN SCREEN ---------- */
  #pin-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .pin-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:32px 28px; width:100%; max-width:340px; text-align:center;
  }
  .pin-card .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; margin-bottom:6px;}
  .pin-card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:22px;}
  .pin-card input{
    width:100%; padding:14px; border:1px solid var(--line); border-radius:10px;
    font-size:22px; text-align:center; letter-spacing:6px; margin-bottom:14px;
  }
  .pin-card input:focus-visible{outline:3px solid var(--amber);}
  .pin-card button{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:24px;
    padding:13px; font-weight:700; font-size:15px;
  }
  .pin-card button:hover{background:var(--teal-dark);}
  .pin-error{color:var(--coral); font-size:13px; margin-top:10px; min-height:16px;}

  /* ---------- DASHBOARD ---------- */
  #dashboard{min-height:100vh; display:none;}
  #dashboard.show{display:block;}
  header{
    background:var(--teal); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  header .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px;}
  .header-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:13px; font-weight:600;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.28);}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:16px 20px 0;
  }
  .toolbar .count{font-family:'Space Grotesk', sans-serif; font-size:16px;}
  .toggle-all{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);}

  .orders-list{padding:16px 20px 40px; display:flex; flex-direction:column; gap:14px; max-width:720px; margin:0 auto;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;}

  .order-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;
  }
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .order-id{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px;}
  .order-time{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .status-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px; white-space:nowrap;
  }
  .status-pill.placed{background:#E7E2D0; color:#6b5f3d;}
  .status-pill.preparing{background:#FCE8CE; color:#8a5a12;}
  .status-pill.out{background:#D6E9F5; color:#1a5a82;}
  .status-pill.delivered{background:#DCEEE0; color:#1f6b3a;}

  .order-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed var(--line);}
  .order-row:last-of-type{border-bottom:none;}
  .order-row .label{color:var(--ink-soft);}
  .order-items{font-size:12.5px; color:var(--ink); white-space:pre-line; margin-top:2px;}

  .pay-flags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .flag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px;}
  .flag.paid{background:#DCEEE0; color:#1f6b3a;}
  .flag.notpaid{background:#FBDFD9; color:#a13a26;}
  .flag.mpesa{background:#D6E9F5; color:#1a5a82;}
  .flag.cod{background:#FCE8CE; color:#8a5a12;}

  .order-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .action-btn{
    flex:1; min-width:110px; border:none; border-radius:20px; padding:10px 12px;
    font-size:12.5px; font-weight:700; color:#fff;
  }
  .action-btn.preparing{background:var(--amber); color:var(--ink);}
  .action-btn.out{background:#3E7FA6;}
  .action-btn.delivered{background:var(--teal);}
  .action-btn:hover{opacity:0.88;}
  .action-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .contact-row{display:flex; gap:8px; margin-top:8px;}
  .contact-btn{
    flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:20px;
    padding:9px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .contact-btn:hover{background:var(--bg);}

  @media (max-width:480px){
    header{padding:14px 16px;}
    .orders-list{padding:14px 16px 40px;}
  }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pin-screen">
  <div class="pin-card">
    <div class="logo">🛍 Duka Zoom</div>
    <div class="sub">Riders App — enter your access PIN</div>
    <input type="password" id="pin-input" inputmode="numeric" placeholder="••••" maxlength="6">
    <button id="pin-submit">Enter</button>
    <p class="pin-error" id="pin-error"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="logo">🛍 Duka Zoom — Riders</div>
    <div class="header-actions">
      <button class="icon-btn" id="refresh-btn">🔄 Refresh</button>
      <button class="icon-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="count" id="order-count">Loading orders…</div>
    <label class="toggle-all">
      <input type="checkbox" id="show-all-toggle">
      Show delivered too
    </label>
  </div>

  <div class="orders-list" id="orders-list">
    <p class="empty-state">Loading…</p>
  </div>
</div>

<script>
  // =========================================================
  // CONFIG — same webhook URL as the main site, plus a shared
  // access PIN for riders. Change the PIN any time by editing
  // this one line (no Apps Script changes needed for that).
  // =========================================================
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw-OaVKDCtDG2TpuR873_XCwWtR86qjDQV9lfmwxMRjatBCPj_jgj-HMQi93vCoTxf9/exec';
  const RIDER_PIN = '1234'; // change this to whatever PIN you want riders to use

  const STATUS_FLOW = ['Placed', 'Preparing', 'Out for Delivery', 'Delivered'];
  const AUTO_REFRESH_MS = 30000;

  const fmt = (n) => 'KSh ' + Number(n || 0).toLocaleString();

  // ---- JSONP helper (same pattern as the main site) ----
  function jsonpRequest(url, params){
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const query = new URLSearchParams({ ...params, callback: callbackName }).toString();
      const cleanup = () => { delete window[callbackName]; script.remove(); };
      const timeout = setTimeout(() => { cleanup(); reject(new Error('Request timed out.')); }, 10000);
      window[callbackName] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
      script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error('Could not reach the server.')); };
      script.src = `${url}?${query}`;
      document.body.appendChild(script);
    });
  }

  // ---- PIN GATE ----
  const pinScreen = document.getElementById('pin-screen');
  const dashboard = document.getElementById('dashboard');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');

  document.getElementById('pin-submit').addEventListener('click', tryPin);
  pinInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') tryPin(); });

  function tryPin(){
    if (pinInput.value.trim() === RIDER_PIN){
      pinScreen.classList.add('hidden');
      dashboard.classList.add('show');
      loadOrders();
      setInterval(loadOrders, AUTO_REFRESH_MS);
    } else {
      pinError.textContent = 'Incorrect PIN — try again.';
      pinInput.value = '';
    }
  }

  document.getElementById('logout-btn').addEventListener('click', ()=>{
    dashboard.classList.remove('show');
    pinScreen.classList.remove('hidden');
    pinInput.value = '';
    pinError.textContent = '';
  });

  // ---- ORDERS ----
  const ordersList = document.getElementById('orders-list');
  const orderCount = document.getElementById('order-count');
  const showAllToggle = document.getElementById('show-all-toggle');

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);
  showAllToggle.addEventListener('change', loadOrders);

  function statusClass(status){
    if (status === 'Preparing') return 'preparing';
    if (status === 'Out for Delivery') return 'out';
    if (status === 'Delivered') return 'delivered';
    return 'placed';
  }

  function nextStatus(current){
    const idx = STATUS_FLOW.indexOf(current);
    return idx >= 0 && idx < STATUS_FLOW.length - 1 ? STATUS_FLOW[idx + 1] : null;
  }

  function loadOrders(){
    if (SHEET_WEBHOOK_URL.includes('PASTE_YOUR')){
      ordersList.innerHTML = '<p class="empty-state">Not connected yet — paste your Apps Script Web App URL into SHEET_WEBHOOK_URL in this file.</p>';
      orderCount.textContent = 'Not connected';
      return;
    }
    jsonpRequest(SHEET_WEBHOOK_URL, { action: 'getOrders', includeAll: showAllToggle.checked ? '1' : '0' })
      .then(data => {
        if (data.status === 'ok'){
          renderOrders(data.orders);
        } else {
          ordersList.innerHTML = `<p class="empty-state">${data.message || 'Could not load orders.'}</p>`;
        }
      })
      .catch(()=>{
        ordersList.innerHTML = '<p class="empty-state">Could not reach the server — check your connection and try Refresh.</p>';
      });
  }

  function renderOrders(orders){
    orderCount.textContent = orders.length + (orders.length === 1 ? ' order' : ' orders');
    if (orders.length === 0){
      ordersList.innerHTML = '<p class="empty-state">No active orders right now. 🎉</p>';
      return;
    }

    ordersList.innerHTML = orders.map(o => {
      const next = nextStatus(o.orderStatus);
      const itemLines = String(o.items || '').split('\n');
      const qtyLines = String(o.quantities || '').split('\n');
      const itemsDisplay = itemLines.map((name, i) => `${qtyLines[i] || '1'}x ${name}`).join('\n');
      const paidFlag = o.paymentStatus === 'Paid'
        ? `<span class="flag paid">Paid</span>`
        : `<span class="flag notpaid">Not Paid</span>`;
      const methodFlag = String(o.paymentMethod || '').toLowerCase().includes('cash')
        ? `<span class="flag cod">Cash on Delivery</span>`
        : `<span class="flag mpesa">M-Pesa</span>`;
      const whatsappHref = `https://wa.me/${String(o.phone).replace(/[^0-9]/g,'')}`;

      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">${o.orderId || '(no ID)'}</div>
              <div class="order-time">${new Date(o.timestamp).toLocaleString()}</div>
            </div>
            <span class="status-pill ${statusClass(o.orderStatus)}">${o.orderStatus}</span>
          </div>

          <div class="order-row"><span class="label">Customer</span><span>${o.name}</span></div>
          <div class="order-row"><span class="label">Phone</span><span>${o.phone}</span></div>
          <div class="order-row"><span class="label">Address</span><span>${o.address}</span></div>
          <div class="order-row"><span class="label">Items</span></div>
          <div class="order-items">${itemsDisplay}</div>
          <div class="order-row"><span class="label">Delivery fee</span><span>${fmt(o.deliveryFee)}</span></div>
          <div class="order-row"><span class="label">Total</span><span><b>${fmt(o.total)}</b></span></div>

          <div class="pay-flags">${methodFlag}${paidFlag}</div>

          <div class="contact-row">
            <a class="contact-btn" href="tel:${o.phone}">📞 Call</a>
            <a class="contact-btn" href="${whatsappHref}" target="_blank" rel="noopener">💬 WhatsApp</a>
          </div>

          <div class="order-actions">
            ${next
              ? `<button class="action-btn ${statusClass(next)}" data-order-id="${o.orderId}" data-new-status="${next}">Mark as ${next}</button>`
              : `<button class="action-btn delivered" disabled>Delivered ✓</button>`
            }
          </div>
        </div>`;
    }).join('');

    ordersList.querySelectorAll('[data-order-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> updateStatus(btn.dataset.orderId, btn.dataset.newStatus, btn));
    });
  }

  function updateStatus(orderId, newStatus, btn){
    btn.disabled = true;
    btn.textContent = 'Updating…';
    jsonpRequest(SHEET_WEBHOOK_URL, { action: 'updateOrderStatus', orderId, newStatus })
      .then(data => {
        if (data.status === 'ok'){
          loadOrders(); // refresh the whole list so the card reflects the new status
        } else {
          alert(data.message || 'Could not update status.');
          btn.disabled = false;
        }
      })
      .catch(()=>{
        alert('Could not reach the server — try again.');
        btn.disabled = false;
      });
  }
</script>

</body>
</html>

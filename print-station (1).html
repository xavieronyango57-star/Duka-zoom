<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duka Zoom Print Station</title>
<style>
:root{--bg:#F4F7F3;--card:#fff;--ink:#16231C;--soft:#5B6B60;--line:#DCE5D9;--brand:#0F7A4D;--warn:#B45309;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0F1612;--card:#17211B;--ink:#E8F0EA;--soft:#9FB1A4;--line:#2A382F;--brand:#3DBB84;--warn:#F5B454;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--soft);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--brand);color:#fff}
button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}.err{color:var(--err);font-size:13.5px;margin-top:8px}
.order{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.small{font-size:13px;color:var(--soft)}
#receipt{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  html,body{background:#fff}
  #app{display:none!important}
  #receipt{display:block;width:72mm;margin:0 auto;padding:3mm 0;color:#000;font:12px/1.35 "Courier New",monospace}
}
#receipt .c{text-align:center}#receipt .b{font-weight:bold}
#receipt .hr{border-top:1px dashed #000;margin:5px 0}
#receipt .r{display:flex;justify-content:space-between;gap:6px}
#receipt .big{font-size:15px;font-weight:bold}
</style>
</head>
<body>
<div id="app" class="wrap">
  <h1>🖨️ Print Station</h1>
  <p class="sub">Shows your orders so you can print a receipt on the shop printer.</p>

  <div class="card" id="login">
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Owner PIN" class="grow">
      <button id="go">Log in</button>
    </div>
    <div class="small" style="margin-top:6px">The PIN is not saved. You will log in again after about 6 hours.</div>
    <div class="err" id="loginErr" role="alert"></div>
  </div>

  <div id="main" hidden>
    <div class="card row">
      <label>Auto-print new orders
        <select id="auto"><option value="off">Off</option><option value="on">On</option></select></label>
      <label class="small"><input type="checkbox" id="all"> Show delivered orders</label>
      <span class="grow"></span>
      <button class="alt" id="test">Test print</button>
      <button class="alt" id="refresh">Refresh</button>
      <button class="alt" id="logout">Log out</button>
    </div>
    <div class="small" id="status" style="margin:0 2px 8px"></div>
    <div id="list"></div>
  </div>
</div>
<div id="receipt"></div>

<script>
(function(){
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-OaVKDCtDG2TpuR873_XCwWtR86qjDQV9lfmwxMRjatBCPj_jgj-HMQi93vCoTxf9/exec';
  var BUSINESS = { name: 'Duka Zoom', address: 'Umoja, Nairobi, Kenya', phone: '0706 481 366', till: '1668989' };
  var token = null, orders = [], seen = {}, firstLoad = true, queue = [], printing = false, timer = null;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var money = function(n){ return 'KSh ' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
  var feeText = function(f){ return (f !== '' && f != null && !isNaN(Number(f))) ? money(f) : String(f || 'to be confirmed'); };

  function api(params){
    return new Promise(function(resolve, reject){
      var cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement('script');
      var t = setTimeout(function(){ done(); reject(new Error('The shop server did not answer. Try again.')); }, 25000);
      function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = function(d){ done(); resolve(d); };
      s.onerror = function(){ done(); reject(new Error('Network problem. Check the internet.')); };
      s.src = SCRIPT_URL + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
      document.head.appendChild(s);
    });
  }

  function receiptHtml(o){
    var names = String(o.items || '').split('\n'), qtys = String(o.quantities || '').split('\n');
    var lines = names.map(function(n, i){ return '<div>' + esc(qtys[i]) + ' x ' + esc(n) + '</div>'; }).join('');
    var pay = String(o.paymentStatus || '').trim();
    var banner = pay === 'Paid' ? 'PAID' : (pay === 'Awaiting Confirmation' ? 'M-PESA PAYMENT AWAITING CONFIRMATION' : 'PAY ON DELIVERY: ' + money(o.total));
    var when = new Date(o.timestamp);
    return '<div class="c big">' + esc(BUSINESS.name) + '</div>' +
      '<div class="c">' + esc(BUSINESS.address) + '<br>Tel ' + esc(BUSINESS.phone) + '<br>M-Pesa Till ' + esc(BUSINESS.till) + '</div>' +
      '<div class="hr"></div>' +
      '<div>Order: <span class="b">' + esc(o.orderId) + '</span></div>' +
      '<div>Date: ' + esc(isNaN(when) ? '' : when.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })) + '</div>' +
      '<div>Customer: ' + esc(o.name) + '</div><div>Phone: ' + esc(o.phone) + '</div><div>Deliver to: ' + esc(o.address) + '</div>' +
      '<div class="hr"></div>' + lines + '<div class="hr"></div>' +
      '<div class="r"><span>Delivery fee</span><span>' + esc(feeText(o.deliveryFee)) + '</span></div>' +
      '<div class="r big"><span>TOTAL</span><span>' + esc(money(o.total)) + '</span></div>' +
      '<div>Payment: ' + esc(o.paymentMethod) + '</div><div class="b c" style="margin-top:4px">' + esc(banner) + '</div>' +
      '<div class="hr"></div><div class="c">Thank you for shopping with ' + esc(BUSINESS.name) + '</div><div class="c">&nbsp;</div>';
  }

  function runQueue(){
    if (printing || !queue.length) return;
    printing = true;
    var o = queue.shift();
    $('receipt').innerHTML = receiptHtml(o);
    setTimeout(function(){ window.print(); setTimeout(function(){ printing = false; runQueue(); }, 1500); }, 200);
  }
  function printOrder(o){ queue.push(o); runQueue(); }

  function render(){
    var box = $('list'); box.textContent = '';
    if (!orders.length){ box.innerHTML = '<div class="card small">No orders to show.</div>'; return; }
    orders.slice(0, 60).forEach(function(o){
      var d = document.createElement('div'); d.className = 'card order';
      var when = new Date(o.timestamp);
      d.innerHTML = '<div><b>' + esc(o.orderId) + '</b> <span class="chip">' + esc(o.orderStatus) + '</span> <span class="chip">' + esc(o.paymentStatus) + '</span>' +
        '<div class="small">' + esc(o.name) + ' · ' + esc(o.phone) + ' · ' + esc(money(o.total)) + ' · ' + esc(isNaN(when) ? '' : when.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</div>' +
        '<div class="small">' + esc(String(o.items || '').split('\n').join(', ')) + '</div></div>';
      var b = document.createElement('button'); b.textContent = 'Print'; b.onclick = function(){ printOrder(o); };
      d.appendChild(b); box.appendChild(d);
    });
  }

  function logout(msg){
    token = null; clearInterval(timer); timer = null;
    document.title = msg ? '⚠ Log in to resume printing' : 'Duka Zoom Print Station';
    if (!msg){ firstLoad = true; seen = {}; try { localStorage.removeItem('dz_seen'); } catch (e) {} }
    $('main').hidden = true; $('login').hidden = false; $('pin').value = ''; $('loginErr').textContent = msg || '';
  }

  function load(){
    $('status').textContent = 'Updating…';
    return api({ action: 'getOrders', token: token, includeAll: $('all').checked ? '1' : '' }).then(function(d){
      if (d.status !== 'ok'){ if (d.code === 'auth' || d.code === 'forbidden') return logout((d.message || 'Session ended.') + ' Auto-print is paused until you log in again.'); throw new Error(d.message || 'Could not load orders.'); }
      orders = d.orders || [];
      var fresh = orders.filter(function(o){ return !seen[o.orderId]; });
      orders.forEach(function(o){ seen[o.orderId] = true; });
      try { localStorage.setItem('dz_seen', JSON.stringify(Object.keys(seen).slice(-300))); } catch (e) {}
      var recent = fresh.filter(function(o){ return Date.now() - new Date(o.timestamp).getTime() < 12 * 3600 * 1000; });
      if (!firstLoad && $('auto').value === 'on') recent.slice().reverse().forEach(printOrder);
      firstLoad = false;
      render();
      $('status').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + (document.hasFocus() ? '' : '. Keep this tab open for auto-print.');
    }).catch(function(e){ $('status').textContent = e.message; });
  }

  $('go').onclick = function(){
    $('loginErr').textContent = '';
    var pin = $('pin').value.trim();
    if (!pin){ $('loginErr').textContent = 'Enter the owner PIN.'; return; }
    $('go').disabled = true;
    api({ action: 'staffLogin', pin: pin }).then(function(d){
      if (d.status !== 'ok') throw new Error(d.message || 'Login failed.');
      if (d.role !== 'owner') throw new Error('Use the owner PIN, not a rider PIN.');
      token = d.token; $('pin').value = ''; document.title = 'Duka Zoom Print Station';
      $('login').hidden = true; $('main').hidden = false;
      load(); timer = setInterval(load, 20000);
    }).catch(function(e){ $('loginErr').textContent = e.message; }).then(function(){ $('go').disabled = false; });
  };
  $('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('go').click(); });
  try { $('auto').value = localStorage.getItem('dz_auto') || 'off'; } catch (e) {}
  $('auto').onchange = function(){ try { localStorage.setItem('dz_auto', $('auto').value); } catch (e) {} };
  try {
    var stored = JSON.parse(localStorage.getItem('dz_seen') || 'null');
    if (stored && stored.length){ stored.forEach(function(id){ seen[id] = true; }); firstLoad = false; }
  } catch (e) {}
  $('refresh').onclick = load;
  $('all').onchange = load;
  $('logout').onclick = function(){ api({ action: 'staffLogout', token: token }).catch(function(){}); logout(''); };
  $('test').onclick = function(){
    printOrder({ orderId: 'TEST-001', timestamp: new Date().toISOString(), name: 'Test Customer', phone: '0700 000 000', address: 'Umoja, Nairobi',
      items: 'Sample item A\nSample item B', quantities: '2\n1', deliveryFee: 200, total: 2200, paymentMethod: 'M-Pesa till', paymentStatus: 'Paid' });
  };
})();
</script>
</body>
</html>

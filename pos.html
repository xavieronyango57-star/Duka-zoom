<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duka Zoom Point of Sale</title>
<style>
:root{--g:#167A4B;--gd:#0B3D26;--bg:#F2F6F1;--card:#fff;--ink:#14231B;--soft:#5B6B60;--line:#DCE5D9;--err:#B3261E;--amber:#F2A93B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}.hide{display:none!important}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#login{max-width:360px;margin:14vh auto}.err{color:var(--err);font-size:13px;margin-top:8px}.soft{color:var(--soft);font-size:13px}
header{background:var(--gd);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header b{font-size:17px}.grow{flex:1}
header .btn{background:rgba(255,255,255,.14)}
#main{display:grid;grid-template-columns:1fr 380px;gap:14px;padding:14px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:92px}
.tile:hover{border-color:var(--g)}.tile.out{opacity:.45;cursor:not-allowed}.tile .n{font-weight:600;font-size:13.5px}.tile .p{font-weight:800;color:var(--g)}.tile .s{font-size:11.5px;color:var(--soft)}
.line{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.line .nm{flex:1;font-size:13.5px}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}.q button{border:0;background:#f4f7f3;width:30px;height:30px;font-weight:800;cursor:pointer}.q span{min-width:28px;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;padding:4px 0}.big{font-size:24px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m,.mo{padding:10px;border:2px solid var(--line);border-radius:10px;text-align:center;cursor:pointer;font-weight:700;background:#fff}.m.on,.mo.on{border-color:var(--g);background:#E4F3EA}
.ok{background:#E4F3EA;border:1px solid #bfe3cd;border-radius:12px;padding:14px;text-align:center}
.sale{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.void{text-decoration:line-through;color:var(--soft)}
#receipt{display:none}
@media print{@page{size:80mm auto;margin:0}html,body{background:#fff}#app,#login{display:none!important}
#receipt{display:block;width:66mm;margin:0 auto;padding:3mm 0;color:#000;font:12px/1.35 "Courier New",monospace}
#receipt .c{text-align:center}#receipt .b{font-weight:bold}#receipt .hr{border-top:1px dashed #000;margin:5px 0}#receipt .r{display:flex;justify-content:space-between;gap:6px}#receipt .big{font-size:15px}}
@media(max-width:900px){#main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="card">
  <h2 style="margin:0 0 4px">Point of Sale</h2><p class="soft" style="margin:0 0 10px">Enter your cashier or owner PIN. It is not saved.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <button class="btn" id="go" style="width:100%;margin-top:10px">Log in</button><div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <header><b>🛒 Duka Zoom POS</b><span id="who" class="soft" style="color:#cfe6d8"></span><span class="grow"></span>
    <button class="btn" id="today">Today’s sales</button><button class="btn" id="logout">Log out</button></header>
  <div id="main">
    <section>
      <input id="search" placeholder="Search a product, or scan a barcode and press Enter" autofocus>
      <div class="chips" id="chips"></div><div id="tiles"></div><div class="soft" id="note" style="margin-top:8px"></div>
    </section>
    <section class="card">
      <div id="cartView">
        <div class="two" style="margin-bottom:8px"><div class="mo on" data-mode="counter">Counter sale</div><div class="mo" data-mode="phone">Phone order</div></div><h3 style="margin:0 0 4px">Current sale</h3><div id="lines"></div>
        <div class="soft" id="empty" style="padding:14px 0">Tap a product to add it.</div>
        <div style="display:flex;gap:6px;margin-top:10px"><input id="promo" placeholder="Promo code (optional)" style="flex:1"><button class="btn alt" id="ap">Apply</button></div>
        <div class="soft" id="pm"></div>
        <input id="phone" placeholder="Customer phone (optional)" style="margin-top:8px"><div id="phoneBox" class="hide" style="margin-top:8px"><input id="pName" placeholder="Customer name"><input id="pAddr" placeholder="Delivery address (estate, street, house no.)" style="margin-top:6px"><select id="pFee" style="margin-top:6px"><option value="">Choose delivery fee</option><option value="150">Up to 3 km: KSh 150</option><option value="200">3 to 5 km: KSh 200</option><option value="250">5 to 8 km: KSh 250</option><option value="350">8 to 12 km: KSh 350</option><option value="550">12 to 18 km: KSh 550</option></select></div>
        <div style="margin-top:10px"><div class="row"><span>Subtotal</span><span id="sub"></span></div><div class="row"><span>Discount</span><span id="dis"></span></div><div class="row hide" id="feeRow"><span>Delivery</span><span id="feeV"></span></div><div class="row big"><span>Total</span><span id="tot"></span></div></div>
        <div class="two" style="margin-top:8px"><div class="m on" data-m="Cash">Cash</div><div class="m" data-m="M-Pesa">M-Pesa</div></div>
        <div id="cashBox" style="margin-top:8px"><input id="tend" type="number" min="0" placeholder="Cash received"><div class="row soft"><span>Change</span><b id="chg">KSh 0</b></div></div>
        <div class="soft hide" id="mpNote" style="margin-top:8px">Confirm the M-Pesa message on the till phone before completing.</div>
        <button class="btn" id="done" style="width:100%;margin-top:10px;padding:14px" disabled>Complete sale</button>
        <button class="btn alt" id="clr" style="width:100%;margin-top:6px">Clear</button><div class="err" id="serr"></div>
      </div>
      <div id="doneView" class="hide"><div class="ok"><div class="soft">Sale complete</div><div class="big" id="dTot"></div><div id="dChg"></div></div>
        <button class="btn" id="prt" style="width:100%;margin-top:10px">Print receipt</button><button class="btn alt" id="nw" style="width:100%;margin-top:6px">New sale</button></div>
    </section>
  </div>
</div>

<div id="receipt"></div>
<div id="ov" class="hide" style="position:fixed;inset:0;background:rgba(10,30,20,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9"><div class="card" style="width:100%;max-width:520px;max-height:90vh;overflow:auto" id="md"></div></div>

<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbw-OaVKDCtDG2TpuR873_XCwWtR86qjDQV9lfmwxMRjatBCPj_jgj-HMQi93vCoTxf9/exec';
  var SHOP={name:'Duka Zoom',addr:'Umoja, Nairobi, Kenya',tel:'0706 481 366',till:'1668989'};
  var token=null,role='',who='',products=[],stock={},byCode={},cart=[],cat='All',promo=null,method='Cash',mode='counter',saleId=null,last=null,busy=false;
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var ksh=function(n){return 'KSh '+Math.round(Number(n)||0).toLocaleString('en-US')};
  $('ov').classList.add('hide');

  function api(p){return new Promise(function(res,rej){var cb='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
    var t=setTimeout(function(){done();rej(new Error('No answer from the server. Check the internet and try again.'))},25000);
    function done(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=function(d){done();res(d)};s.onerror=function(){done();rej(new Error('Network problem.'))};
    s.src=API+'?'+new URLSearchParams(Object.assign({},p,{callback:cb})).toString();document.head.appendChild(s)})}

  function newId(){saleId='POS-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
  function key(n){return String(n).toLowerCase()}

  function loadAll(){return api({action:'posProducts'}).then(function(d){
    if(d.status!=='ok'||!d.products||!d.products.length){$('note').textContent=d.message||'No priced products found. Check the Products and Stock tabs.';return}
    products=d.products;stock={};byCode={};
    d.products.forEach(function(r){stock[key(r.name)]={qty:r.qty,inStock:r.inStock};if(r.barcode)byCode[r.barcode]=r.name});
    $('note').textContent='';chips();tiles()}).catch(function(e){$('note').textContent=e.message})}
  function loadStock(){return loadAll()}

  function chips(){var cs=['All'].concat(Array.from(new Set(products.map(function(p){return p.cat}).filter(Boolean))));
    $('chips').innerHTML=cs.map(function(c){return '<span class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</span>'}).join('');
    $('chips').querySelectorAll('.chip').forEach(function(e){e.onclick=function(){cat=e.dataset.c;chips();tiles()}})}
  function avail(p){var s=stock[key(p.name)];if(!s)return{ok:true,t:''};if(!s.inStock||(s.qty!==null&&s.qty<=0))return{ok:false,t:'Out of stock'};
    return{ok:true,t:s.qty!==null?s.qty+' left':''}}
  function tiles(){var q=$('search').value.trim().toLowerCase();
    var list=products.filter(function(p){return (cat==='All'||p.cat===cat)&&(!q||p.name.toLowerCase().indexOf(q)>-1)});
    $('tiles').innerHTML=list.map(function(p,i){var a=avail(p);return '<button class="tile'+(a.ok?'':' out')+'" data-i="'+products.indexOf(p)+'"><span class="n">'+esc(p.name)+'</span><span class="p">'+ksh(p.price)+'</span><span class="s">'+esc(a.t)+'</span></button>'}).join('')||'<div class="soft">No products match.</div>';
    $('tiles').querySelectorAll('.tile').forEach(function(b){b.onclick=function(){add(products[+b.dataset.i])}})}
  $('search').oninput=tiles;
  $('search').onkeydown=function(e){if(e.key!=='Enter')return;var v=this.value.trim();
    if(byCode[v]){var p=products.filter(function(x){return key(x.name)===key(byCode[v])})[0];if(p){add(p);this.value='';tiles();return}}
    var q=v.toLowerCase(),m=products.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1});if(m.length===1){add(m[0]);this.value='';tiles()}};

  function add(p){if(!p)return;var a=avail(p);if(!a.ok){return}
    var l=cart.filter(function(x){return x.name===p.name})[0];var s=stock[key(p.name)];
    if(l){if(s&&s.qty!==null&&l.qty+1>s.qty){$('serr').textContent='Only '+s.qty+' of '+p.name+' in stock.';return}l.qty++}else cart.push({name:p.name,price:Number(p.price)||0,qty:1});
    $('serr').textContent='';if(!saleId)newId();render()}
  function totals(){var sub=cart.reduce(function(a,l){return a+l.price*l.qty},0),d=promo?Math.round(sub*promo.pct/100):0;var fee=mode==='phone'?(Number($('pFee').value)||0):0;return{sub:sub,dis:d,fee:fee,tot:Math.max(0,sub-d)+fee}}
  function render(){var t=totals();$('empty').classList.toggle('hide',cart.length>0);
    $('lines').innerHTML=cart.map(function(l,i){return '<div class="line"><div class="nm">'+esc(l.name)+'<div class="soft">'+ksh(l.price)+'</div></div><div class="q"><button data-d="-1" data-i="'+i+'">−</button><span>'+l.qty+'</span><button data-d="1" data-i="'+i+'">+</button></div><b>'+ksh(l.price*l.qty)+'</b></div>'}).join('');
    $('lines').querySelectorAll('.q button').forEach(function(b){b.onclick=function(){var l=cart[+b.dataset.i],d=+b.dataset.d,s=stock[key(l.name)];
      if(d>0&&s&&s.qty!==null&&l.qty+1>s.qty){$('serr').textContent='Only '+s.qty+' in stock.';return}l.qty+=d;if(l.qty<=0)cart.splice(+b.dataset.i,1);if(!cart.length){saleId=null;promo=null}render()}});
    $('feeRow').classList.toggle('hide',mode!=='phone');$('feeV').textContent=ksh(t.fee);$('sub').textContent=ksh(t.sub);$('dis').textContent=t.dis?'− '+ksh(t.dis):'—';$('tot').textContent=ksh(t.tot);
    var c=Number($('tend').value)||0;$('chg').textContent=ksh(Math.max(0,c-t.tot));
    $('done').disabled=busy||!cart.length||(method==='Cash'&&c<t.tot&&$('tend').value!=='')}
  $('tend').oninput=render;
  document.querySelectorAll('.m').forEach(function(m){m.onclick=function(){method=m.dataset.m;document.querySelectorAll('.m').forEach(function(x){x.classList.toggle('on',x===m)});
    $('cashBox').classList.toggle('hide',method!=='Cash');$('mpNote').classList.toggle('hide',method!=='M-Pesa');render()}});
  $('pFee').onchange=render;
  function setMode(m){mode=m;document.querySelectorAll('.mo').forEach(function(x){x.classList.toggle('on',x.dataset.mode===m)});var ph=m==='phone',ms=document.querySelectorAll('.m');
    $('phoneBox').classList.toggle('hide',!ph);ms[0].dataset.m=ph?'Cash on Delivery':'Cash';ms[0].textContent=ph?'Cash on delivery':'Cash';ms[1].textContent=ph?'M-Pesa (till)':'M-Pesa';
    method=ms[0].dataset.m;ms.forEach(function(x,i){x.classList.toggle('on',i===0)});$('cashBox').classList.toggle('hide',ph);$('mpNote').classList.add('hide');
    $('mpNote').textContent=ph?'Ask the customer to pay till '+SHOP.till+' before dispatch. The order stays unconfirmed until the payment is marked Paid.':'Confirm the M-Pesa message on the till phone before completing.';
    $('phone').placeholder=ph?'Customer phone (required)':'Customer phone (optional)';$('done').textContent=ph?'Place phone order':'Complete sale';render()}
  document.querySelectorAll('.mo').forEach(function(x){x.onclick=function(){setMode(x.dataset.mode)}});
  $('ap').onclick=function(){var c=$('promo').value.trim();if(!c)return;api({action:'checkPromo',code:c}).then(function(d){
    if(d.status==='ok'){promo={code:c.toUpperCase(),pct:d.discount};$('pm').textContent='Applied: '+d.discount+'% off'}else{promo=null;$('pm').textContent=d.message||'Invalid code'}render()}).catch(function(){$('pm').textContent='Could not check the code.'})};
  $('clr').onclick=reset;
  function reset(){cart=[];promo=null;saleId=null;$('promo').value='';$('phone').value='';$('tend').value='';$('pName').value='';$('pAddr').value='';$('pFee').value='';$('pm').textContent='';$('serr').textContent='';
    $('cartView').classList.remove('hide');$('doneView').classList.add('hide');render();$('search').focus()}

  $('done').onclick=function(){if(busy||!cart.length)return;var t=totals(),tend=Number($('tend').value)||0;
    if(mode==='phone'&&(!$('pName').value.trim()||!$('phone').value.trim()||$('pAddr').value.trim().length<4||!$('pFee').value)){$('serr').textContent='Enter the customer name, phone, delivery address and delivery fee.';return}
    if(method==='Cash'&&$('tend').value!==''&&tend<t.tot){$('serr').textContent='Cash received is less than the total.';return}
    busy=true;$('done').disabled=true;$('done').textContent='Saving…';$('serr').textContent='';
    api({action:'posSale',token:token,saleId:saleId,method:method,promo:promo?promo.code:'',phone:$('phone').value,kind:mode,name:$('pName').value,address:$('pAddr').value,fee:t.fee,
      items:JSON.stringify(cart.map(function(l){return{name:l.name,qty:l.qty}}))}).then(function(d){
      if(d.status!=='ok'){if(d.code==='auth')return out(d.message);throw new Error(d.message||'Sale failed.')}
      last={d:d,tend:tend,lines:d.lines||cart.map(function(l){return{name:l.name,qty:l.qty,unit:l.price,amount:l.price*l.qty}}),total:d.total!=null?d.total:t.tot,subtotal:d.subtotal!=null?d.subtotal:t.sub,discount:d.discount||t.dis,method:method,kind:mode,fee:t.fee,custName:$('pName').value,custPhone:$('phone').value,addr:$('pAddr').value,time:d.time||new Date().toISOString(),cashier:d.cashier||who,id:d.orderId};
      $('dTot').textContent=ksh(last.total);$('dTot').previousElementSibling.textContent=mode==='phone'?'Phone order placed':'Sale complete';
      $('dChg').textContent=mode==='phone'?('Order '+last.id+'. '+(method==='M-Pesa'?'Customer pays till '+SHOP.till+' before dispatch.':'Customer pays cash on delivery.')):(method==='Cash'&&tend>last.total?'Change: '+ksh(tend-last.total):(method==='M-Pesa'?'Paid by M-Pesa':''));
      $('cartView').classList.add('hide');$('doneView').classList.remove('hide');if(mode!=='phone')printReceipt();loadStock();
    }).catch(function(e){$('serr').textContent=e.message+' If unsure whether it saved, check Today’s sales before trying again.'})
    .then(function(){busy=false;$('done').textContent=mode==='phone'?'Place phone order':'Complete sale';render()})};
  $('nw').onclick=reset;$('prt').onclick=printReceipt;

  function printReceipt(){if(!last)return;var L=last;
    var rows=L.lines.map(function(l){return '<div>'+esc(l.name)+'</div><div class="r"><span>'+l.qty+' x '+Math.round(l.unit).toLocaleString('en-US')+'</span><span>'+Math.round(l.amount).toLocaleString('en-US')+'</span></div>'}).join('');
    $('receipt').innerHTML='<div class="c b big">'+esc(SHOP.name)+'</div><div class="c">'+esc(SHOP.addr)+'<br>Tel '+esc(SHOP.tel)+'</div><div class="hr"></div>'+
      '<div>Receipt: '+esc(L.id)+'</div><div>'+new Date(L.time).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</div><div>Served by: '+esc(L.cashier)+'</div>'+(L.kind==='phone'?'<div class="b">PHONE ORDER</div><div>Customer: '+esc(L.custName)+'</div><div>Phone: '+esc(L.custPhone)+'</div><div>Deliver to: '+esc(L.addr)+'</div>':'')+'<div class="hr"></div>'+rows+'<div class="hr"></div>'+(L.kind==='phone'?'<div class="r"><span>Delivery fee</span><span>'+ksh(L.fee)+'</span></div>':'')+
      (L.discount?'<div class="r"><span>Subtotal</span><span>'+ksh(L.subtotal)+'</span></div><div class="r"><span>Discount</span><span>− '+ksh(L.discount)+'</span></div>':'')+
      '<div class="r b big"><span>TOTAL</span><span>'+ksh(L.total)+'</span></div>'+(L.kind==='phone'?'<div class="b c">'+(L.method==='M-Pesa'?'PAY M-PESA TILL '+SHOP.till:'PAY ON DELIVERY')+': '+ksh(L.total)+'</div>':'<div>Paid: '+esc(L.method)+'</div>')+
      (L.method==='Cash'&&L.tend>L.total?'<div class="r"><span>Cash</span><span>'+ksh(L.tend)+'</span></div><div class="r"><span>Change</span><span>'+ksh(L.tend-L.total)+'</span></div>':'')+
      '<div class="hr"></div><div class="c">Thank you for shopping with '+esc(SHOP.name)+'</div><div class="c">&nbsp;</div>';
    setTimeout(function(){window.print()},200)}

  function openM(h){$('md').innerHTML=h;$('ov').classList.remove('hide')}function closeM(){$('ov').classList.add('hide')}
  $('ov').onclick=function(e){if(e.target===$('ov'))closeM()};
  $('today').onclick=function(){openM('<div class="soft">Loading…</div>');api({action:'posSummary',token:token}).then(function(d){
    if(d.status!=='ok')throw new Error(d.message||'Could not load.');var t=d.totals;
    openM('<h3 style="margin:0 0 6px">Today’s counter sales</h3><div class="row"><span>Sales</span><b>'+t.count+'</b></div><div class="row"><span>Total</span><b>'+ksh(t.total)+'</b></div><div class="row"><span>Cash to be in the till</span><b>'+ksh(t.cash)+'</b></div><div class="row"><span>M-Pesa</span><b>'+ksh(t.mpesa)+'</b></div>'+
      Object.keys(d.byCashier).map(function(k){return '<div class="row soft"><span>'+esc(k)+'</span><span>'+ksh(d.byCashier[k])+'</span></div>'}).join('')+'<div style="margin:10px 0 4px;font-weight:700">Sales</div>'+
      (d.sales.map(function(s){return '<div class="sale'+(s.voided?' void':'')+'"><b>'+new Date(s.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</b> · '+ksh(s.total)+' · '+esc(s.method)+' · '+esc(s.cashier)+(s.voided?' · VOIDED':'')+'<div class="soft">'+esc(s.items)+'</div>'+
        (role==='owner'&&!s.voided?'<button class="btn alt" data-v="'+esc(s.id)+'" style="padding:4px 10px;margin-top:4px">Void</button>':'')+'</div>'}).join('')||'<div class="soft">No sales yet today.</div>')+
      ((d.phoneOrders&&d.phoneOrders.length)?'<div style="margin:12px 0 4px;font-weight:700">Phone orders today</div>'+d.phoneOrders.map(function(s){return '<div class="sale"><b>'+new Date(s.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</b> · '+ksh(s.total)+' · '+esc(s.customer)+' · '+esc(s.status)+' · '+esc(s.payment)+'<div class="soft">'+esc(s.items)+'</div>'+(role==='owner'&&s.status==='Placed'?'<button class="btn alt" data-v="'+esc(s.id)+'" style="padding:4px 10px;margin-top:4px">Cancel</button>':'')+'</div>'}).join(''):'')+'<button class="btn alt" id="mc" style="margin-top:10px">Close</button>');
    $('mc').onclick=closeM;$('md').querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){var r=prompt('Why is this sale being voided?');if(r===null)return;
      api({action:'posVoid',token:token,orderId:b.dataset.v,reason:r}).then(function(x){if(x.status!=='ok')throw new Error(x.message);closeM();loadStock();$('today').click()}).catch(function(e){alert(e.message)})}})
  }).catch(function(e){openM('<div class="err">'+esc(e.message)+'</div><button class="btn alt" id="mc">Close</button>');$('mc').onclick=closeM})};

  function out(m){token=null;$('app').classList.add('hide');$('login').classList.remove('hide');$('pin').value='';$('lerr').textContent=m||'';closeM()}
  $('go').onclick=function(){$('lerr').textContent='';var pin=$('pin').value.trim();if(!pin){$('lerr').textContent='Enter your PIN.';return}$('go').disabled=true;
    api({action:'posLogin',pin:pin}).then(function(d){if(d.status!=='ok')throw new Error(d.message||'Login failed.');
      token=d.token;role=d.role;who=d.name;$('who').textContent='· '+who+' ('+role+')';$('login').classList.add('hide');$('app').classList.remove('hide');
      cart=[];promo=null;saleId=null;render();loadAll();$('search').focus();
    }).catch(function(e){$('lerr').textContent=e.message}).then(function(){$('go').disabled=false})};
  $('pin').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
  $('logout').onclick=function(){if(cart.length&&!confirm('There is an unfinished sale. Log out anyway?'))return;api({action:'staffLogout',token:token}).catch(function(){});out('')};
  setInterval(function(){if(token&&!busy)loadStock()},60000);
})();
</script>
</body>
</html>
